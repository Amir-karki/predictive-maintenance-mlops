name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-serve.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -v -rs

  docker:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-serve.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Make a stand-in champion export
        run: python -m ci.make_standin_model

      - name: Build the image
        run: docker build -t turbofan-api:ci .

      - name: Start the container
        run: docker run -d -p 8000:8000 --name turbofan-api turbofan-api:ci

      - name: Smoke test
        run: python -m ci.smoke_test

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA::7}"
          docker tag turbofan-api:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "Published $IMAGE:$TAG"

      - name: Show container logs
        if: always()
        run: docker logs turbofan-api