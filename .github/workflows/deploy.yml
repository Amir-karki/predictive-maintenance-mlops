name: Deploy

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        name: Deploy to ECS
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
        steps:
            - name: Show what would be deployed
              run: echo "Commit ${{ github.event.workflow_run.head_sha }}, model v${{ vars.MODEL_VERSION }}"

            - name: Check out the tested commit
              uses: actions/checkout@v5
              with:
                ref: ${{ github.event.workflow_run.head_sha }}
  
            - name: Sign in to AWS
              uses: aws-actions/configure-aws-credentials@v5
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: us-west-2

            - name: Fetch the model from S3
              run: |
               aws s3 cp "s3://turbofan-storage/models/v${{ vars.MODEL_VERSION }}/" build/champion/ --recursive
               ls -la build/champion
               cat build/champion/model_info.json

            - name: Check the model version matches
              run: test "$(jq .version build/champion/model_info.json)" = "${{ vars.MODEL_VERSION }}"

            - name: Log in to ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push the image
              env:
               REGISTRY: ${{ steps.ecr.outputs.registry }}
               TAG: ${{ github.event.workflow_run.head_sha }}
              run: |
               docker build -t "$REGISTRY/turbofan-api:$TAG" .
               docker push "$REGISTRY/turbofan-api:$TAG"

            - name: Deploy to ECS Express
              id: deploy
              uses: aws-actions/amazon-ecs-deploy-express-service@v1
              with:
                service-name: turbofan-api
                image: ${{ steps.ecr.outputs.registry }}/turbofan-api:${{ github.event.workflow_run.head_sha }}
                execution-role-arn: arn:aws:iam::195275643864:role/ecsTaskExecutionRole
                infrastructure-role-arn: arn:aws:iam::195275643864:role/ecsInfrastructureRoleForExpressServices
                container-port: 8000
                health-check-path: /health
                cpu: '512'
                memory: '1024'
                min-task-count: 1
                max-task-count: 1

            - name: Show the service URL
              run: echo "Deployed ${{ steps.deploy.outputs.endpoint }}"