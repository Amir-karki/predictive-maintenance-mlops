name: Deploy

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        name: Deploy to ECS
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
        steps:
            - name: Show what would be deployed
              run: echo "Commit ${{ github.event.workflow_run.head_sha }}, model v${{ vars.MODEL_VERSION }}"

            - name: Check out the tested commit
              uses: actions/checkout@v5
              with:
                ref: ${{ github.event.workflow_run.head_sha }}

            - name: Sign in to AWS
              uses: aws-actions/configure-aws-credentials@v5
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: us-west-2

            - name: Who am I?
              run: aws sts get-caller-identity