name: Deploy

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        name: Deploy to ECS
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
        steps:
            - name: Show what would be deployed
              run: echo "Commit ${{ github.event.workflow_run.head_sha }}, model v${{ vars.MODEL_VERSION }}"

            - name: Check out the tested commit
              uses: actions/checkout@v5
              with:
                ref: ${{ github.event.workflow_run.head_sha }}
            - name: Show the OIDC claims
              run: |
                URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
                TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL" | jq -r .value)
                python3 - "$TOKEN" <<'PY'
                import sys, json, base64
                part = sys.argv[1].split(".")[1]
                part += "=" * (-len(part) % 4)
                claims = json.loads(base64.urlsafe_b64decode(part))
                print({k: claims.get(k) for k in ("sub", "aud", "repository", "ref", "event_name")})
                PY

            - name: Sign in to AWS
              uses: aws-actions/configure-aws-credentials@v5
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: us-west-2

            - name: Fetch the model from S3
              run: |
               aws s3 cp "s3://turbofan-storage/models/v${{ vars.MODEL_VERSION }}/" build/champion/ --recursive
               ls -la build/champion
               cat build/champion/model_info.json

            - name: Check the model version matches
              run: test "$(jq .version build/champion/model_info.json)" = "${{ vars.MODEL_VERSION }}"